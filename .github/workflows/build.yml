name: Build apps
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Bundle default API key (optional)
        shell: bash
        env:
          DEFAULT_API_KEY: ${{ secrets.DEFAULT_API_KEY }}
        run: |
          if [ -n "$DEFAULT_API_KEY" ]; then printf '{"apiKey":"%s"}' "$DEFAULT_API_KEY" > defaults.json; fi
      - run: npm install
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.os }}
          path: dist/DriveZip-*
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DriveZip-*
